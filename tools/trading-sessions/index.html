<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Sessions — MyForexKit</title>
<meta name="description" content="Live forex trading session times for Sydney, Tokyo, London and New York, with open/closed status in your local time.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<div id="mfk-header"></div>

<section class="tool-page-hero">
  <div class="container">
    <p class="breadcrumb"><a href="../../index.html">Home</a> / <a href="../index.html">Tools</a> / Trading Sessions</p>
    <span class="eyebrow">Market hours</span>
    <h1>Trading Sessions</h1>
    <p>Live open/closed status for the four major forex sessions, shown in your local time and updated automatically — including daylight saving changes.</p>
  </div>
</section>

<section>
  <div class="container" style="padding:48px 0 96px;">
    <p class="sessions-utc" id="utc-clock">—</p>
    <div class="sessions-grid" id="sessions-grid"></div>
  </div>
</section>

<div id="mfk-footer"></div>
<script src="../../js/calculations.js"></script>
<script src="../../js/components.js"></script>
<script>
MFKComponents.mount("../../");

const grid = document.getElementById('sessions-grid');
const utcClock = document.getElementById('utc-clock');
const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

function fmtLocalTime(now, timeZone){
  return new Intl.DateTimeFormat('en-US', { timeZone, hour:'2-digit', minute:'2-digit', hour12:true }).format(now);
}
function fmtDuration(mins){
  const h = Math.floor(mins/60);
  const m = mins % 60;
  if(h===0) return `${m}m`;
  return `${h}h ${m}m`;
}
function hourLabel(h){
  const period = h>=12 ? 'PM':'AM';
  let hh = h % 12; if(hh===0) hh=12;
  return `${hh}:00 ${period}`;
}

function render(){
  const now = new Date();
  utcClock.textContent = `UTC ${now.toUTCString().split(' ')[4]} · Your local time zone: ${localTz}`;

  const sessions = MFK.computeSessions(now);
  grid.innerHTML = sessions.map(s=>{
    const localOpenClose = `${hourLabel(s.openHour)} – ${hourLabel(s.closeHour)} (${s.timeZone.split('/')[1].replace('_',' ')} local)`;
    const yourLocal = fmtLocalTime(now, localTz);
    const sessionLocal = fmtLocalTime(now, s.timeZone);
    return `
      <div class="session-card ${s.isOpen ? 'open':''}">
        <div class="session-top">
          <div>
            <div class="session-name">${s.name}</div>
            <div class="session-tz">${s.timeZone}</div>
          </div>
          <span class="session-status ${s.isOpen?'open-s':'closed-s'}">${s.isOpen?'Open':'Closed'}</span>
        </div>
        <div class="session-times">Session hours: ${localOpenClose}</div>
        <div class="session-times">Local time there: ${sessionLocal}</div>
        <div class="session-times">Your time: ${yourLocal}</div>
        <div class="session-countdown">${s.nextEvent==='close' ? 'Closes in ' : 'Opens in '}${fmtDuration(s.minutesToNextEvent)}</div>
      </div>
    `;
  }).join('');
}

render();
setInterval(render, 30000);
</script>
</body>
</html>
